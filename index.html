<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hibou Empire — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0b0e14;--card:#141822;--border:#232838;--gold:#d4a94a;--text:#f2f2f2;--gray:#8b93a7;--green:#3ecf8e;--red:#f43f5e;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;padding:16px;padding-bottom:60px;}
  h1{font-size:18px;display:flex;align-items:center;gap:8px;margin:0 0 16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  button{cursor:pointer;font-family:inherit;font-weight:700;border:none;border-radius:10px;padding:10px 14px;font-size:13px;}
  .btn-gold{background:linear-gradient(135deg,var(--gold),#b8860b);color:#000;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-green{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;}
  .btn-red{background:transparent;border:1px solid rgba(244,63,94,.4);color:var(--red);}
  input{width:100%;padding:11px;background:#0f1420;border:1px solid var(--border);border-radius:10px;color:#fff;font-size:14px;margin-bottom:10px;}
  .row{display:flex;gap:8px;}
  .slides{display:flex;gap:6px;overflow-x:auto;margin:8px 0;}
  .slides img{width:90px;height:120px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#000;}
  .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800;}
  .tag{font-size:11px;color:var(--gray);}
  #login{max-width:340px;margin:80px auto;}
  #app{display:none;}
</style>
</head>
<body>

<div id="login">
  <h1>🦉 Hibou Empire</h1>
  <input id="email" type="email" placeholder="Email admin">
  <input id="password" type="password" placeholder="Mot de passe">
  <button class="btn-gold" style="width:100%" onclick="login()">Connexion</button>
  <div id="login-error" style="color:var(--red);font-size:12px;margin-top:8px;"></div>
</div>

<div id="app">
  <h1>🦉 Hibou Empire <span class="tag" style="margin-left:auto;font-weight:400;" id="who"></span></h1>

  <div class="card">
    <div class="row" style="margin-bottom:8px;">
      <button class="btn-gold" style="flex:1" onclick="generate('today')">Générer pour aujourd'hui</button>
      <button class="btn-ghost" style="flex:1" onclick="generate('tomorrow')">Générer pour demain</button>
    </div>
    <div class="tag">Format : carrousel 6 slides, publié identique sur Instagram + TikTok à l'heure planifiée.</div>
  </div>

  <div id="list"></div>
</div>

<script>
const SUPABASE_URL = "https://cperffhnqepxpjvorqzu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yBRmlZox3ZB0tfzNPRk8Kg_HnYEFtmz";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null;
const pollers = {};

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { document.getElementById('login-error').textContent = error.message; return; }
  session = data.session;
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('who').textContent = email;
  loadPosts();
}

async function getToken() {
  const { data } = await sb.auth.getSession();
  return data && data.session ? data.session.access_token : '';
}

async function api(endpoint, body) {
  const token = await getToken();
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(body || {})
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Erreur serveur');
  return data;
}

function dateStrOffset(offset) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

async function generate(which) {
  const dateStr = which === 'tomorrow' ? dateStrOffset(1) : dateStrOffset(0);
  try {
    const data = await api('/api/generate-content', { dateStr });
    pollSlides(data.id, data.statusUrls, data.slides);
    loadPosts();
  } catch (e) { alert('Erreur génération : ' + e.message); }
}

// ============================================================
// Composition Canvas : fond Higgsfield + texte réel habillé (pas de blur,
// bande sombre pour la lisibilité, jamais de texte directement sur la
// photo IA) -- même principe que Score Master.
// ============================================================
async function loadImageViaProxy(url) {
  const token = await getToken();
  const res = await fetch('/api/image-bridge', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ action: 'proxy', url })
  });
  const data = await res.json();
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = data.dataUri;
  });
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  return lines;
}

async function compositeSlide(bgUrl, text, index, total) {
  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0, 0, W, H);

  const img = await loadImageViaProxy(bgUrl);
  const photoH = H * 0.62;
  const scale = Math.max(W / img.width, photoH / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  ctx.drawImage(img, (W - dw) / 2, 0, dw, dh);

  const grad = ctx.createLinearGradient(0, photoH * 0.35, 0, photoH);
  grad.addColorStop(0, 'rgba(11,14,20,0)');
  grad.addColorStop(1, 'rgba(11,14,20,1)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, photoH);

  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0, photoH, W, H - photoH);

  // Index badge
  ctx.fillStyle = 'rgba(212,169,74,0.15)';
  ctx.beginPath(); ctx.arc(W - 70, 70, 34, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d4a94a';
  ctx.font = '700 26px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText((index + 1) + '/' + total, W - 70, 72);

  // Owl watermark
  ctx.font = '44px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('🦉', 40, 80);

  // Main text
  const marginX = W * 0.1;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = '800 58px Arial';
  const lines = wrapText(ctx, text, W - marginX * 2);
  const lineHeight = 68;
  const blockH = lines.length * lineHeight;
  let y = photoH + (H - photoH - blockH) / 2 + lineHeight * 0.7;
  lines.forEach(l => { ctx.fillText(l, W / 2, y); y += lineHeight; });

  if (index === 0) {
    ctx.font = '600 24px Arial';
    ctx.fillStyle = '#d4a94a';
    ctx.fillText('SWIPE →', W / 2, H - 40);
  }

  return canvas.toDataURL('image/jpeg', 0.96);
}

async function pollSlides(id, statusUrls, slides) {
  const done = new Array(statusUrls.length).fill(false);
  statusUrls.forEach((statusUrl, i) => {
    let attempts = 0;
    const key = id + '-' + i;
    pollers[key] = setInterval(async () => {
      attempts++;
      try {
        const data = await api('/api/check-status', { statusUrl, rowId: id });
        if (data.done && !data.failed) {
          clearInterval(pollers[key]); delete pollers[key];
          done[i] = true;
          const composited = await compositeSlide(data.imageUrl, slides[i].text, i, statusUrls.length);
          await api('/api/image-bridge', { action: 'upload', id, imageDataUri: composited, slideIndex: i });
          if (done.every(Boolean)) {
            await sb.from('pending_posts').update({ status: 'pending' }).eq('id', id);
          }
          loadPosts();
        } else if (data.done && data.failed) {
          clearInterval(pollers[key]); delete pollers[key];
          loadPosts();
        } else if (attempts > 40) {
          clearInterval(pollers[key]); delete pollers[key];
        }
      } catch (e) { console.error(e); }
    }, 5000);
  });
}

function resumeIfGenerating(rows) {
  rows.forEach(r => {
    if (r.status === 'generating' && Array.isArray(r.hf_status_urls) && r.overlay_data && r.overlay_data.slides) {
      if (!pollers[r.id + '-0']) pollSlides(r.id, r.hf_status_urls, r.overlay_data.slides);
    }
  });
}

async function loadPosts() {
  const { data, error } = await sb.from('pending_posts').select('*').order('scheduled_for', { ascending: true }).order('scheduled_time', { ascending: true }).limit(60);
  if (error) { console.error(error); return; }
  resumeIfGenerating(data || []);
  const list = document.getElementById('list');
  list.innerHTML = (data || []).map(renderCard).join('') || '<div class="tag">Aucun post pour l\'instant.</div>';
}

const STATUS_LABEL = {
  generating: ['⏳ Génération en cours...', '#d4a94a'],
  pending: ['📝 Prêt à approuver', '#8b93a7'],
  approved: ['⏰ Approuvé', '#3ea0cf'],
  published: ['✅ Publié', '#3ecf8e'],
  failed: ['❌ Échec', '#f43f5e'],
  rejected: ['Rejeté', '#8b93a7']
};

function renderCard(p) {
  const [label, color] = STATUS_LABEL[p.status] || [p.status, '#8b93a7'];
  const thumbs = (Array.isArray(p.carousel_images) ? p.carousel_images : []).filter(Boolean)
    .map(url => `<img src="${url}">`).join('');
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <span class="badge" style="background:${color}22;color:${color};">${label}</span>
      <span class="tag">${p.scheduled_for || '?'} ${p.scheduled_time || ''}</span>
    </div>
    ${thumbs ? `<div class="slides">${thumbs}</div>` : ''}
    <div style="font-size:13px;white-space:pre-wrap;margin:8px 0;">${(p.caption || '').slice(0, 200)}${(p.caption || '').length > 200 ? '…' : ''}</div>
    ${p.error ? `<div class="tag" style="color:var(--red);">${p.error}</div>` : ''}
    <div class="row">
      ${p.status === 'pending' ? `<button class="btn-green" style="flex:1" onclick="approve('${p.id}')">Approuver</button>` : ''}
      ${p.status === 'approved' ? `<button class="btn-gold" style="flex:1" onclick="publishNow('${p.id}')">Publier maintenant</button>` : ''}
      ${p.status === 'pending' || p.status === 'approved' ? `<button class="btn-red" onclick="reject('${p.id}')">Rejeter</button>` : ''}
    </div>
  </div>`;
}

async function approve(id) {
  await sb.from('pending_posts').update({ status: 'approved', reviewed_at: new Date().toISOString() }).eq('id', id);
  loadPosts();
}
async function reject(id) {
  await sb.from('pending_posts').update({ status: 'rejected', reviewed_at: new Date().toISOString() }).eq('id', id);
  loadPosts();
}
async function publishNow(id) {
  try { await api('/api/publish', { id }); loadPosts(); }
  catch (e) { alert('Erreur : ' + e.message); }
}

sb.auth.getSession().then(({ data }) => {
  if (data && data.session) {
    session = data.session;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('who').textContent = data.session.user.email;
    loadPosts();
  }
});
</script>
</body>
</html>

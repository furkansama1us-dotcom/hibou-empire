<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0b0e14;--card:#141822;--border:#232838;--gold:#d4a94a;--text:#f2f2f2;--gray:#8b93a7;--green:#3ecf8e;--red:#f43f5e;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overscroll-behavior-y:contain;}
  /* Cadre façon appli mobile : centré, largeur fixe sur grand écran, plein écran sur téléphone */
  .app-wrap{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));}
  h1{font-size:18px;display:flex;align-items:center;gap:8px;margin:0 0 16px;position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:5;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  button{cursor:pointer;font-family:inherit;font-weight:700;border:none;border-radius:10px;padding:12px 14px;font-size:14px;-webkit-user-select:none;user-select:none;}
  button:disabled{opacity:.6;cursor:default;}
  button:active:not(:disabled){transform:scale(.98);}
  .btn-gold{background:linear-gradient(135deg,var(--gold),#b8860b);color:#000;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-green{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;}
  .btn-red{background:transparent;border:1px solid rgba(244,63,94,.4);color:var(--red);}
  input{width:100%;padding:13px;background:#0f1420;border:1px solid var(--border);border-radius:10px;color:#fff;font-size:16px;margin-bottom:10px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .row > button{flex:1;min-width:140px;}
  .slides{display:flex;gap:6px;overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch;}
  .slides img{width:90px;height:120px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#000;}
  .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800;}
  .tag{font-size:11px;color:var(--gray);}
  #login{max-width:320px;margin:20vh auto 0;}
  #app{display:none;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.25);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1c2130;border:1px solid var(--border);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .25s,transform .25s;z-index:100;max-width:90vw;text-align:center;pointer-events:none;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="app-wrap">
<div id="login">
  <h1>🛩️ Nova</h1>
  <input id="email" type="email" placeholder="Email admin" autocomplete="username">
  <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <button class="btn-gold" style="width:100%" onclick="login()">Connexion</button>
  <div id="login-error" style="color:var(--red);font-size:12px;margin-top:8px;"></div>
</div>

<div id="app">
  <h1>🛩️ Nova <span class="tag" style="margin-left:auto;font-weight:400;" id="who"></span></h1>

  <div class="card">
    <div class="tag">Le contenu se génère automatiquement chaque nuit (routine planifiée, 50 jours pré-écrits). Approuve ci-dessous, la publication Instagram + TikTok part toute seule à l'heure prévue.</div>
  </div>

  <div id="list"></div>
</div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = "https://cperffhnqepxpjvorqzu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yBRmlZox3ZB0tfzNPRk8Kg_HnYEFtmz";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null;

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { document.getElementById('login-error').textContent = error.message; return; }
  session = data.session;
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('who').textContent = email;
  loadPosts();
}

async function getToken() {
  const { data } = await sb.auth.getSession();
  return data && data.session ? data.session.access_token : '';
}

async function api(endpoint, body) {
  const token = await getToken();
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(body || {})
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Erreur serveur');
  return data;
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

async function loadPosts() {
  const { data, error } = await sb.from('pending_posts').select('*').order('scheduled_for', { ascending: true }).order('scheduled_time', { ascending: true }).limit(60);
  if (error) { console.error(error); return; }
  const list = document.getElementById('list');
  list.innerHTML = (data || []).map(renderCard).join('') || '<div class="tag">Aucun post pour l\'instant -- la routine nocturne en dépose un nouveau chaque soir.</div>';
}

const STATUS_LABEL = {
  generating: ['⏳ Génération en cours...', '#d4a94a'],
  pending: ['📝 Prêt à approuver', '#8b93a7'],
  approved: ['⏰ Approuvé', '#3ea0cf'],
  published: ['✅ Publié', '#3ecf8e'],
  failed: ['❌ Échec', '#f43f5e'],
  rejected: ['Rejeté', '#8b93a7']
};

function renderCard(p) {
  const [label, color] = STATUS_LABEL[p.status] || [p.status, '#8b93a7'];
  const thumbs = (Array.isArray(p.carousel_images) ? p.carousel_images : []).filter(Boolean)
    .map(url => `<img src="${url}">`).join('');
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <span class="badge" style="background:${color}22;color:${color};">${label}</span>
      <span class="tag">${p.scheduled_for || '?'} ${p.scheduled_time || ''}</span>
    </div>
    ${thumbs ? `<div class="slides">${thumbs}</div>` : ''}
    <div style="font-size:13px;white-space:pre-wrap;margin:8px 0;">${(p.caption || '').slice(0, 200)}${(p.caption || '').length > 200 ? '…' : ''}</div>
    ${p.error ? `<div class="tag" style="color:var(--red);">${p.error}</div>` : ''}
    <div class="row">
      ${p.status === 'pending' ? `<button class="btn-green" style="flex:1" onclick="approve('${p.id}')">Approuver</button>` : ''}
      ${p.status === 'approved' ? `<button class="btn-gold" style="flex:1" onclick="publishNow('${p.id}')">Publier maintenant</button>` : ''}
      ${p.status === 'pending' || p.status === 'approved' ? `<button class="btn-red" onclick="reject('${p.id}')">Rejeter</button>` : ''}
    </div>
  </div>`;
}

async function approve(id) {
  await sb.from('pending_posts').update({ status: 'approved', reviewed_at: new Date().toISOString() }).eq('id', id);
  loadPosts();
}
async function reject(id) {
  await sb.from('pending_posts').update({ status: 'rejected', reviewed_at: new Date().toISOString() }).eq('id', id);
  loadPosts();
}
async function publishNow(id) {
  try { await api('/api/publish', { id }); showToast('🚀 Publié !'); loadPosts(); }
  catch (e) { showToast('❌ Erreur : ' + e.message); }
}

sb.auth.getSession().then(({ data }) => {
  if (data && data.session) {
    session = data.session;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('who').textContent = data.session.user.email;
    loadPosts();
  }
});
</script>
</body>
</html>
